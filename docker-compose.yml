services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16
    environment:
      POSTGRES_DB: wordgame
      POSTGRES_USER: wordgame
      POSTGRES_PASSWORD: wordgame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordgame"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: docker.m.daocloud.io/library/redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
